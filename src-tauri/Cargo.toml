[package]
name = "gsb-wifi-autologin"
version = "1.9.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
scraper = "0.22"
tokio = { version = "1", default-features = false, features = ["net", "sync", "time"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
dirs = "6"
hostname = "0.4"
mac_address = "1"
rand = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Windows yerel API'leri: olay-tabanli yeniden baglanma (IP arayuz degisikligi
# bildirimi) ve DPAPI ile kimlik bilgisi sifreleme. Yalnizca Windows'ta cekilir;
# Linux yol haritasi bu bagimliligi getirmez.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
