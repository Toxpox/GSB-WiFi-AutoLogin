name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Frontend syntax check
        shell: pwsh
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/giris.js
          node --check frontend/js/log.js
          node --check frontend/js/hosgeldin.js
          node --check frontend/js/tani.js

      - name: Version consistency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cargoToml = Get-Content -Raw -Encoding UTF8 src-tauri/Cargo.toml
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "src-tauri/Cargo.toml version bulunamadi."
          }
          $version = $Matches[1]

          # tauri.conf.json ve config.rs versiyonu Cargo.toml'dan alir
          # (env!("CARGO_PKG_VERSION") / Tauri v2 fallback), ayrica kontrol gerekmez.

          $frontendApp = Get-Content -Raw -Encoding UTF8 frontend/js/app.js
          $frontendVersionLine = 'let VERSION = "' + $version + '";'
          if ($frontendApp -notmatch [regex]::Escape($frontendVersionLine)) {
            throw "frontend/js/app.js VERSION fallback degeri $version ile uyusmuyor."
          }

          $cargoLock = Get-Content -Raw -Encoding UTF8 src-tauri/Cargo.lock
          $lockPattern = '(?ms)\[\[package\]\]\s+name = "gsb-wifi-autologin"\s+version = "' + [regex]::Escape($version) + '"'
          if ($cargoLock -notmatch $lockPattern) {
            throw "Cargo.lock proje paketi versiyonu $version ile uyusmuyor."
          }

          $readme = Get-Content -Raw -Encoding UTF8 README.md
          if ($readme -notmatch [regex]::Escape("version-$version-blue")) {
            throw "README.md version rozeti $version ile uyusmuyor."
          }

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            if ($tag -ne "v$version") {
              throw "Git tag ($tag) proje versiyonu (v$version) ile uyusmuyor."
            }
          }

  build:
    needs: check
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $portableSource = "src-tauri/target/release/gsb-wifi-autologin.exe"
          $installerSource = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1

          if (!(Test-Path $portableSource)) {
            throw "Portable exe bulunamadi: $portableSource"
          }
          if ($null -eq $installerSource) {
            throw "NSIS installer bulunamadi."
          }

          Copy-Item $portableSource "GSB_WiFi_AutoLogin_portable.exe"
          Copy-Item $installerSource.FullName "GSB_WiFi_AutoLogin_setup.exe"

          # Updater imzasi: .sig yoksa FAIL — latest.json'siz tek bir release
          # bile releases/latest/download endpoint'i uzerinden TUM
          # istemcilerin guncelleme kontrolunu kirar.
          $sigSource = "$($installerSource.FullName).sig"
          if (!(Test-Path $sigSource)) {
            throw "Updater imzasi bulunamadi: $sigSource (TAURI_SIGNING_PRIVATE_KEY secret'i tanimli mi?)"
          }
          $signature = (Get-Content -Raw -Encoding UTF8 $sigSource).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Updater imzasi bos: $sigSource"
          }

          $cargoToml = Get-Content -Raw -Encoding UTF8 src-tauri/Cargo.toml
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "src-tauri/Cargo.toml version bulunamadi."
          }
          $version = $Matches[1]

          $latestJson = @{
            version = "v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/Toxpox/GSB-WiFi-AutoLogin/releases/download/v$version/GSB_WiFi_AutoLogin_setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 4

          # PowerShell 5.1: Set-Content/Out-File UTF-16 BOM yazar; updater
          # BOM'suz UTF-8 bekler.
          [IO.File]::WriteAllText("$PWD/latest.json", $latestJson, [Text.UTF8Encoding]::new($false))

          $files = @(
            "GSB_WiFi_AutoLogin_portable.exe",
            "GSB_WiFi_AutoLogin_setup.exe",
            "latest.json"
          )

          $hashLines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
            "$hash  $file"
          }
          Set-Content -Path "SHA256SUMS.txt" -Value $hashLines -Encoding ASCII

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GSB_WiFi_AutoLogin_portable.exe
            GSB_WiFi_AutoLogin_setup.exe
            latest.json
            SHA256SUMS.txt
