name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Platformdan bagimsiz, hizli kapilar. Derleme matrisinden once koser ve
  # bariz hatalarda uc runner'i birden mesgul etmez.
  hizli-kontrol:
    name: Bicim, surum ve frontend
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.surum.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Surum tutarliligi
        id: surum
        run: python3 scripts/surum-kontrol.py --yaz-github-output

      # Release yardimcilari bozulursa ya release yayinlanmaz ya da bozuk bir
      # latest.json tum istemcilerin guncellemesini kirar; her kosumda test edilir.
      - name: Release araclari testleri
        run: python3 scripts/test_release_araclari.py

      - name: CHANGELOG surum girdisi
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/changelog-bolum.py "${{ github.ref_name }}" --kontrol

      - name: Frontend sozdizimi
        run: |
          set -euo pipefail
          shopt -s nullglob
          dosyalar=(frontend/js/*.js)
          if [ ${#dosyalar[@]} -eq 0 ]; then
            echo "frontend/js altinda JS dosyasi bulunamadi" >&2
            exit 1
          fi
          for dosya in "${dosyalar[@]}"; do
            node --check "$dosya"
          done

  # Uc platformda da test ve lint. fail-fast kapali: bir platformun hatasi
  # digerlerinin sonucunu gizlemesin, tek kosumda tam tablo gorulsun.
  test:
    name: Test (${{ matrix.os }})
    needs: hizli-kontrol
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Linux sistem bagimliliklari
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            file

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  # Etiketli kosumda her platform icin paket uretir ve artefakt olarak yukler.
  # Release islemi ayri bir isle yapilir; boylece bir platform basarisiz
  # olursa yarim bir release yayinlanmaz.
  paketle:
    name: Paketle (${{ matrix.ad }})
    needs: [hizli-kontrol, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ad: windows-x86_64
            hedefler: nsis
          # En eski desteklenen glibc: burada uretilen paket daha yeni
          # dagitimlarda da calisir, tersi gecerli degil.
          - os: ubuntu-22.04
            ad: linux-x86_64
            hedefler: deb,rpm,appimage
          - os: macos-latest
            ad: macos-aarch64
            hedefler: dmg,app
          # Intel yapisi ayni Apple Silicon runner'inda capraz derlenir:
          # macos-13 (Intel runner) GitHub tarafindan emekliye ayriliyor.
          - os: macos-latest
            ad: macos-x86_64
            hedefler: dmg,app
            rust_hedef: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_hedef }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: paket-${{ matrix.ad }}

      - name: Linux sistem bagimliliklari
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            file \
            fuse \
            desktop-file-utils

      - name: Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Derle ve paketle
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri build --bundles ${{ matrix.hedefler }} \
            ${{ matrix.rust_hedef && format('--target {0}', matrix.rust_hedef) || '' }}

      - name: Artefaktlari topla
        shell: bash
        env:
          VERSION: ${{ needs.hizli-kontrol.outputs.version }}
          AD: ${{ matrix.ad }}
          RUST_HEDEF: ${{ matrix.rust_hedef }}
        run: |
          set -euo pipefail
          mkdir -p cikti
          # --target verildiginde cargo ciktiyi target/<ucgen>/release altina koyar.
          if [ -n "${RUST_HEDEF:-}" ]; then
            derleme="src-tauri/target/$RUST_HEDEF/release"
          else
            derleme="src-tauri/target/release"
          fi
          bundle="$derleme/bundle"

          kopyala() {
            # $1: glob, $2: hedef dosya adi. Eslesme yoksa hata verir:
            # sessiz atlama, imzasiz veya eksik bir release'e yol acardi.
            local bulunan
            bulunan=$(ls $1 2>/dev/null | head -n1 || true)
            if [ -z "$bulunan" ]; then
              echo "HATA: beklenen artefakt bulunamadi: $1" >&2
              exit 1
            fi
            cp "$bulunan" "cikti/$2"
            echo "toplandi: $2  <- $bulunan"
          }

          case "$AD" in
            windows-x86_64)
              kopyala "$bundle/nsis/*-setup.exe" "GSB_WiFi_AutoLogin_${VERSION}_setup.exe"
              kopyala "$bundle/nsis/*-setup.exe.sig" "GSB_WiFi_AutoLogin_${VERSION}_setup.exe.sig"
              cp "$derleme/gsb-wifi-autologin.exe" \
                 "cikti/GSB_WiFi_AutoLogin_${VERSION}_portable.exe"
              ;;
            linux-x86_64)
              kopyala "$bundle/deb/*.deb" "GSB_WiFi_AutoLogin_${VERSION}_amd64.deb"
              kopyala "$bundle/rpm/*.rpm" "GSB_WiFi_AutoLogin_${VERSION}_x86_64.rpm"
              kopyala "$bundle/appimage/*.AppImage" "GSB_WiFi_AutoLogin_${VERSION}_amd64.AppImage"
              kopyala "$bundle/appimage/*.AppImage.sig" "GSB_WiFi_AutoLogin_${VERSION}_amd64.AppImage.sig"
              ;;
            macos-aarch64|macos-x86_64)
              ark="${AD#macos-}"
              kopyala "$bundle/dmg/*.dmg" "GSB_WiFi_AutoLogin_${VERSION}_${ark}.dmg"
              # Updater .app.tar.gz uzerinden calisir, .dmg uzerinden degil.
              kopyala "$bundle/macos/*.app.tar.gz" "GSB_WiFi_AutoLogin_${VERSION}_${ark}.app.tar.gz"
              kopyala "$bundle/macos/*.app.tar.gz.sig" "GSB_WiFi_AutoLogin_${VERSION}_${ark}.app.tar.gz.sig"
              ;;
          esac

          if [ -z "$(ls -A cikti)" ]; then
            echo "HATA: $AD icin hicbir artefakt uretilmedi." >&2
            exit 1
          fi
          ls -la cikti

      - uses: actions/upload-artifact@v5
        with:
          name: paket-${{ matrix.ad }}
          path: cikti/*
          if-no-files-found: error
          retention-days: 7

  # Tum platformlar basariyla paketlendikten sonra tek bir release yayinlar.
  # Surum notu CHANGELOG.md'den uretilir, elle yazilmaz.
  release:
    name: Release yayinla
    needs: [hizli-kontrol, paketle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v6
        with:
          pattern: paket-*
          path: indirilen
          merge-multiple: true

      - name: Surum notunu CHANGELOG'dan uret
        env:
          VERSION: ${{ needs.hizli-kontrol.outputs.version }}
        run: |
          set -euo pipefail
          {
            python3 scripts/changelog-bolum.py "$VERSION"
            echo
            echo "---"
            echo
            echo "### Hangi dosyayi indirmeliyim?"
            echo
            echo "| Platform | Dosya |"
            echo "|:---|:---|"
            echo "| Windows (kurulum, otomatik guncellemeli) | \`*_setup.exe\` |"
            echo "| Windows (portable) | \`*_portable.exe\` |"
            echo "| Debian, Ubuntu turevleri | \`*_amd64.deb\` |"
            echo "| Fedora, RHEL, openSUSE | \`*_x86_64.rpm\` |"
            echo "| Diger Linux dagitimlari (otomatik guncellemeli) | \`*_amd64.AppImage\` |"
            echo "| macOS Apple Silicon | \`*_aarch64.dmg\` |"
            echo "| macOS Intel | \`*_x86_64.dmg\` |"
            echo
            echo "Dosya butunlugunu \`SHA256SUMS.txt\` ile dogrulayabilirsiniz."
            echo
            echo "> macOS paketleri henuz noter onayli degildir; ilk acilista"
            echo "> Gatekeeper uyarisi gorebilirsiniz."
          } > surum-notu.md
          cat surum-notu.md

      - name: latest.json ve SHA256SUMS uret
        env:
          VERSION: ${{ needs.hizli-kontrol.outputs.version }}
        run: python3 scripts/release-manifest.py --version "$VERSION" --dizin indirilen

      - name: Yuklenecek dosyalar
        run: ls -la indirilen

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: surum-notu.md
          files: indirilen/*
          fail_on_unmatched_files: true
